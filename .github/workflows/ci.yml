name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github src tests examples
      - name: Ruff format
        run: ruff format --check src tests examples
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  examples:
    name: Examples against a live server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Start the emulator
        run: |
          saci --port 8000 > emulator.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs localhost:8000/_saci/health && exit 0
            sleep 0.5
          done
          cat emulator.log
          exit 1
      - name: Python example
        run: pytest examples/python-pytest -p no:cacheprovider
        env:
          ASAAS_BASE_URL: http://localhost:8000
      - name: Node.js example
        run: node examples/node/payout.mjs
        env:
          ASAAS_BASE_URL: http://localhost:8000
      - name: Emulator log
        if: failure()
        run: cat emulator.log

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/saci --port 8001 &
          for i in $(seq 1 30); do
            curl -fs localhost:8001/_saci/health && exit 0
            sleep 0.5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Runs the contract suite against the real Asaas sandbox. Needs a repository secret
  # named ASAAS_SANDBOX_API_KEY; skipped on pull requests, forks and when it is absent.
  conformance:
    name: Contract tests against the Asaas sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    env:
      ASAAS_CONFORMANCE_API_KEY: ${{ secrets.ASAAS_SANDBOX_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Contract tests against api-sandbox.asaas.com
        if: env.ASAAS_CONFORMANCE_API_KEY != ''
        env:
          ASAAS_CONFORMANCE_BASE_URL: https://api-sandbox.asaas.com
        run: pytest -m conformance -v
      - name: No sandbox key configured
        if: env.ASAAS_CONFORMANCE_API_KEY == ''
        run: echo "::notice::Set the ASAAS_SANDBOX_API_KEY secret to run contract tests against the real sandbox."
