[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saci"
version = "0.1.0"
description = "Saci: a stateful, deterministic local emulator of the Asaas payments API (Pix, boleto, transfers, webhooks) for development and CI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Spacki" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "asaas", "payments", "pix", "boleto", "emulator", "test-double", "mock-server", "testing",
    "contract-testing", "webhooks", "fintech", "brazil",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
saci = "saci.__main__:main"

[project.urls]
Homepage = "https://github.com/SpackiGabriel/saci"
Issues = "https://github.com/SpackiGabriel/saci/issues"
Changelog = "https://github.com/SpackiGabriel/saci/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/saci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance: tests that must pass against both the emulator and the real Asaas sandbox",
]
addopts = ["--strict-markers"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.coverage.run]
source = ["saci"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
